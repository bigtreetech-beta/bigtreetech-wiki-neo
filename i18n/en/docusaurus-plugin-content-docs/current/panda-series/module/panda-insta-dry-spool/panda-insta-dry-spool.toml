'''
translate = '''
- {{a37879e09bc448db-d8a32e66074b434b-4993c1296e54ad36}}
'''

[[block]]
key = "a37879e09bc448db-d8a32e66074b434b-4993c1296e54ad36"
type = "paragraph"
origin = '''
当使用Panda Insta-Dry Spool烘干时，若烘干温度**大于200摄氏度**时，需要拆下料盘两侧盘体边缘的硅胶圈，并且烘干完成后拿出时需要注意**防烫**。
'''
translate = '''
When drying filament with Panda Insta-Dry Spool at temperatures **above 200 $^\circ\mathrm{C}$**, remove the silicone rings from the outer edges of both spool halves. After drying, use caution when removing the spool because it may be **hot**.
'''

[[block]]
key = "a37879e09bc448db-e090035e68a7bcc1"
