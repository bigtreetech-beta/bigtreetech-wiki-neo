        alt="Location of the innermost connector to disconnect"
        width="50%"
    />
'''

[[block]]
key = "aacca1434ba0c59c"
origin = '''
5. **将原厂插头连接到 Y 型分线器。** 将从打印机上拔下的插头连接到随附 Y 型分线器的白色插座。
'''
translate = '''
5. **Connect the factory plug to the Y-splitter.** Connect the plug removed from the printer to the white receptacle on the supplied Y-splitter cable.
'''

[[block]]
key = "ead06acde4f87c47"
origin = '''
    <ImageView
        src={require('./img/y-splitter-factory-plug.webp').default}
        alt="连接到 Y 型分线器白色插座的原厂插头"
