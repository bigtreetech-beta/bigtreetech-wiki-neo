# Panda Hub PX2
'''
translate = '''
# Panda Hub PX2
'''

[[block]]
key = "e485bcb3a26647b2"
origin = '''
<div class="div-table">

{/* main image */}

<ImageView src={require("./img/panda-hub-px2-title.webp").default} width="45%" class="right-image" />

## 产品简介

BIGTREETECH Panda Hub PX2 是一款紧凑型供电扩展模块，可在打印机腔体内为配件提供额外的供电接口。本产品适用于 Bambu Lab P2S 和 X2D 打印机，可配合打印安装座与随附紧固件安装，固定并保护打印机原有的 USB 连接，减少振动和磨损。

## 技术规格

| 产品参数       | Panda Hub PX2                         |
| -------------- | ------------------------------------- |
| 供电输出接口   | 2 x USB Type-A; 2 x 24V XH2.54      |
| 5V 输出总电流 | 不得超过 1.4A                        |
| 24V 输出总电流 | 不得超过 1A                          |
| USB 数据通信   | 不支持，仅用于供电                    |

</div>
'''
translate = '''
<div class="div-table">

{/* main image */}

<ImageView src={require('@site/docs/panda-series/module/panda-hub-px2/img/panda-hub-px2-title.webp').default} width="45%" class="right-image" />

## Product Overview

The BIGTREETECH Panda Hub PX2 is a compact power expansion module that provides additional power connections for accessories inside the printer chamber. Designed for Bambu Lab P2S and X2D printers, it can be installed with a printed mount and the supplied fasteners to secure and protect the printer's original USB connection from vibration and wear.

## Technical Specifications

| Specification  | Panda Hub PX2                         |
| -------------- | ------------------------------------- |
| Power output interface   | 2 x USB Type-A; 2 x 24V XH2.54      |
| 5V total output current | Maximum 1.4A                        |
| 24V total output current | Maximum 1A                          |
| USB data communication   | Not supported, only for power supply |

</div>
'''

