origin = '''
<div class="div-table">

<ImageView src={require('./img/panda-lux-rgb-px2-title.webp').default} width="40%" class="right-image" />

## 简介

Panda Lux RGB PX2 是一款适用于 Bambu Lab P2S 和 X2D 打印机的双 RGB 灯条套件。它采用与 Panda Lux RGB PX 相同的控制器平台，固件和操作流程，并针对 PX2 采用专用安装结构，双灯条设计以及 Panda Hub PX2 供电模块。

## 功能亮点

- **双灯条：** 提供左右两侧 RGB 照明。
- **打印机同步：** 可跟随打印机原装照明的开关状态。
- **灯光效果：** 包含 Static，Breathing，Strobing，Wave，Marquee，Color Cycle，Rainbow，Warning: Hot 和 H2D Style Status Indicator 模式。
- **Web 控制：** 可通过控制器 Web UI 调节灯光效果，颜色，亮度和速度。
- **维护：** 支持在 Settings 页面进行固件 OTA 更新和恢复出厂设置。

</div>
'''
translate = '''
<div class="div-table">

<ImageView src={require('@site/docs/panda-series/module/panda-lux-rgb-px2/img/panda-lux-rgb-px2-title.webp').default} width="40%" class="right-image" />

## Introduction

Panda Lux RGB PX2 is a dual RGB light-bar kit for Bambu Lab P2S and X2D printers. It uses the same controller platform, firmware, and operating workflow as Panda Lux RGB PX, with PX2-specific mounting, two light bars, and the Panda Hub PX2 power module.

## Feature Highlights

- **Dual Light Bars:** Provides left- and right-side RGB lighting.
- **Printer Synchronization:** Can follow the printer's stock-light on/off state.
- **Lighting Effects:** Includes Static, Breathing, Strobing, Wave, Marquee, Color Cycle, Rainbow, Warning: Hot, and H2D Style Status Indicator modes.
- **Web Control:** Adjusts the effect, color, brightness, and speed from the controller Web UI.
- **Maintenance:** Supports firmware OTA updates and factory reset from the Settings page.

</div>
'''

