# Panda Treat 硬件/安装
'''
translate = '''
# Panda Treat Hardware/Installation
'''

[[block]]
key = "bb439b8560361930"
origin = '''
## 包装内容
'''
translate = '''
## What's in the box?
'''

[[block]]
key = "4f93292800ae47b8"
origin = '''
Panda Treat 套件包含组装和连接食用墨水适配器所需的硬件。
'''
translate = '''
A Panda Treat kit contains the hardware needed to assemble and connect the edible ink adapter.
'''

[[block]]
key = "06859100e1dc43ed"
origin = '''
:::info[安装前打印安装件]

包装盒中不包含安装件，因为每个受支持的打印机型号都需要不同的安装件。Panda Treat 支持多种 3D 打印机型号，因此你可以为自己的机器打印所需的安装件。安装前，请下载并打印为你的打印机型号指定的官方安装件。

:::
'''
translate = '''
:::info[Print the mounting parts before installation]

Mounting parts are not included because each supported printer model requires a different mount. Panda Treat supports multiple 3D printer models, so you can print the exact mounting parts required for your machine. Before installation, download and print the official mounting parts specified for your printer model.

:::
'''

[[block]]
key = "d879dc5addbbe022"
origin = '''
<ImageView src={require('./img/whats-in-the-box.webp').default} width="50%"/>
'''
translate = '''
<ImageView src={require('@site/docs/panda-series/module/panda-treat/img/whats-in-the-box.webp').default} width="50%"/>
'''

[[block]]
key = "0155b1271c194ca2"
origin = '''
盒内包含：
'''
translate = '''
The box includes:
'''

[[block]]
key = "a1118bef765f3d5b"
origin = '''
- Panda Treat PCB (A)
- 官方食用墨水墨盒 (B)
- 适用于 A1，A1 mini，P1 和 X1C 的打印机接口线缆套件：共 2 条线缆 (C)
- M3 x 6 mm 低头内六角自攻螺丝：14 颗 (D)
- 硅胶墨盒密封垫 x 1 (E)
- SD card x 1 (F)
- Allen key x 1 (G)
- P1S / X1C 安装用磁铁 x 4 (H)
- Quick start card x 1 (I)
'''
translate = '''
- Panda Treat PCB (A)
- Official edible ink cartridge (B)
- Printer interface cable set for A1, A1 mini, P1, and X1C: 2 cables in total (C)
- M3 x 6 mm low-profile, hex socket, self-tapping screws: 14 pieces (D)
- Silicone cartridge seal x 1 (E)
- SD card x 1 (F)
- Allen key x 1 (G)
- Magnets for P1S / X1C installations x 4 (H)
- Quick start card x 1 (I)
'''

[[block]]
key = "01fee3051ef7ef86"
origin = '''
:::info[Note]

请使用适用于你具体打印机的安装指南中提到的安装说明，零件和工具。上图展示的是 Panda Treat 套件通常随附的零件。随着产品更新，零件可能会有所变化。

:::
'''
translate = '''
:::info[Note]

Use the installation instructions, parts, and tools mentioned in the installation guide for your specific printer. Typical parts that ship with a Panda Treat kit are shown above. Parts may vary as updates are made.

:::
'''

[[block]]
key = "22a93631846f434a"
origin = '''
## 接口
'''
translate = '''
## Interfaces
'''

[[block]]
key = "c047df1fbcca74bc"
origin = '''
在安装和维护过程中，说明中可能会提到某些 Panda Treat 接口。此处展示并说明这些接口，便于读者在后续使用这些名称时理解它们指的是什么。
'''
translate = '''
During installation and maintenance, reference may be made to certain Panda Treat interfaces. These interfaces are shown and described here so that the reader has an understanding of what is being referenced later when this naming convention is used.
'''

[[block]]
key = "630490a247f48fc6"
origin = '''
<ImageView src={require('./img/hw-interfaces.webp').default} width="50%"/>
'''
translate = '''
<ImageView src={require('@site/docs/panda-series/module/panda-treat/img/hw-interfaces.webp').default} width="50%"/>
'''

[[block]]
key = "41bd289a3302095b"
origin = '''
- `USB-C`: 用于手动更新等固件支持的维护任务。安装时不需要使用此接口。
- `Printer interface connector`: 使用随附的特定机型线缆将 Panda Treat 连接到打印机。安装时需要使用此接口。
- `Cartridge contacts and pins`: 为食用墨水墨盒提供电气连接。
- `SD card slot`: 存储 Panda Treat 打印过程中使用的文件。
'''
translate = '''
- `USB-C`: Used for service tasks such as manual updates where supported by the firmware. This interface is not required for installation.
- `Printer interface connector`: Connects the Panda Treat to the printer using the supplied model-specific cable. This interface is required for installation.
- `Cartridge contacts and pins`: Provide the electrical connection to the edible ink cartridge.
- `SD card slot`: Stores the files used by the Panda Treat during printing.
'''

[[block]]
key = "a4405eb6487501d2"
origin = '''
:::info[Note]

请勿触摸墨盒电气触点。手指油脂以及触点区域损伤可能导致打印效果不佳或墨盒故障。

:::
'''
translate = '''
:::info[Note]

Do not touch the cartridge electrical contacts. Oils from fingers and damage to the contact area can cause poor prints or cartridge faults.

:::
'''

[[block]]
key = "524104a98753e867"
origin = '''
## 重要安装注意事项
'''
translate = '''
## Important installation notes
'''

[[block]]
key = "f6041312ef5da715"
origin = '''
:::info[Important]

连接或断开 Panda Treat 线缆或墨盒之前，请务必关闭打印机电源。

:::
'''
translate = '''
:::info[Important]

Always power off the printer before connecting or disconnecting the Panda Treat cable or cartridge.

:::
'''

[[block]]
key = "a5b4767aaf7e697f"
origin = '''
- 请勿直接拉拽小线缆。请握住连接器本体，并用指甲或合适的塑料工具（例如 [JST connector removal tool](https://makerworld.com/en/models/1169414-jst-connector-removal-tool)）轻轻将其松开。
- 将线缆较小的一端安装到 Panda Treat 后，请尽量避免拆下它，以防损坏线缆。需要拆卸时，请使用上述方法从打印机端拆下线缆。
- 不要强行将墨盒压入安装座。它应通过设计好的拨杆和支撑点卡入到位。
'''
translate = '''
- Never tug directly on small cables. Hold the connector body and gently work it loose using fingernails or a suitable plastic tool such as the [JST connector removal tool](https://makerworld.com/en/models/1169414-jst-connector-removal-tool).
- Once the smaller end of the cable has been installed into the Panda Treat, avoid removing it to prevent cable damage. Instead, remove the cable on the printer end using the method mentioned above.
- Do not force the cartridge into the mount. It should clip into position using the intended lever and support points.
'''

[[block]]
key = "dbcceaeb661df368"
origin = '''
## 安装到 A1
'''
