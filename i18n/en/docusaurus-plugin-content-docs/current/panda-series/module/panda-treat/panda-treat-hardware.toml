key = "7b08a8dea95527fe"
origin = '''
### 所需组件
'''
translate = '''
### Required components
'''

[[block]]
key = "ad9b260949e5abb2"
origin = '''
本安装需要以下零件。如果需要帮助识别其中某个零件，请参考 [包装内容](#包装内容) 和 [接口](#接口) 部分。
