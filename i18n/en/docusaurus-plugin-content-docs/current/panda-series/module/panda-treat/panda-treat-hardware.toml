origin = '''
## 将 A1 或 A1 mini 恢复为普通 3D 打印
'''
translate = '''
## Returning an A1 or A1 mini to ordinary 3D printing
'''

[[block]]
key = "d05aa8c8de6c1f4e"
origin = '''
不再使用 Panda Treat，需要让打印机恢复普通耗材打印时，请按照以下步骤操作。
'''
translate = '''
Use the steps below when Panda Treat is no longer needed and you want to return the printer to ordinary filament printing.
'''

[[block]]
key = "7f1c67ca1f90c153"
origin = '''
:::warning[关闭打印机电源]

完成或取消当前任务，等待打印机进入空闲状态，然后在接触打印头连接器前关闭电源。继续操作前，请让所有高温部件冷却。

:::
'''
translate = '''
:::warning[Switch the printer off]

Finish or cancel the active job, wait until the printer is idle, and switch off its power before touching the toolhead connectors. Allow any hot parts to cool before continuing.

:::
'''

[[block]]
key = "122b3bb11bc29069"
origin = '''
1. 从成型板上取走所有点心和食品安全表面。
2. 从 Panda Treat 中取出食用墨盒。按照[维护与保养](#维护与保养)中的说明擦拭喷头，将墨盒放入装有硅胶密封件的墨盒支架中，并保持直立存放。
3. 从打印头前方释放 Panda Treat 时，请托住整个组件。小心反向执行安装动作：先松开下方连接，再将上方连接抬起并移开。不要拉扯 PCB，墨盒压杆或线缆。
4. 取下打印头后盖以接触连接器。使用 JST 拆卸工具握住塑料外壳，拔下 Panda Treat 连接器。切勿直接拉扯导线。
5. 从安装时折入的空间中取出打印机原装打印头连接器。按照安装步骤中所示的相同方向，将它完全插回原插座。
6. 整理线缆，避免夹住或过度弯折。重新安装适用的打印头前盖和后盖，并确认所有卡扣都已固定。
7. 取下 Panda Treat 接墨桶。对于 A1 mini，请按照安装步骤先松开定位柱，不要强行向上抬起接墨桶。用水冲洗接墨桶以去除排出的食用墨水，然后晾干。
8. 如果食品安全表面是硅胶垫，可以清洗并晾干后再存放或重复使用。使用后的烘焙纸应丢弃。
9. 检查原装打印头线缆是否牢固连接，外盖是否固定，打印头移动时是否会勾住线缆，并确认打印机运动范围内没有遗留任何 Panda Treat 部件。
10. 恢复电源，并在开始耗材打印前确认打印头工作正常。
'''
translate = '''
1. Remove all treats and the food-safe surface from the build plate.
2. Remove the edible ink cartridge from Panda Treat. Wipe the printhead as described in [Maintenance and care](#maintenance-and-care), place the cartridge in its holder with the silicone seal fitted, and store it upright.
3. Support the Panda Treat assembly while releasing it from the front of the toolhead. Reverse the installation movement carefully: release the lower attachment first, then lift the upper attachment away. Do not pull on the PCB, cartridge lever, or cable.
4. Remove the rear toolhead cover to reach the connectors. Use the JST removal tool to unplug the Panda Treat connector by its plastic housing. Never pull directly on the wires.
5. Retrieve the printer's original toolhead connector from the space where it was folded during installation. Insert it fully in the original socket using the same orientation shown in the installation steps.
6. Route the cable without trapping or sharply bending it. Refit the applicable front and rear toolhead covers and confirm that every clip is secure.
7. Remove the Panda Treat purge bucket. On the A1 mini, release the locating posts as described in the installation step instead of forcing the bucket upward. Rinse the bucket with water to remove purged edible ink, then allow it to dry.
8. If the food-safe surface is a silicone mat, wash it and allow it to dry before storage or reuse. Discard parchment paper after use.
9. Check that the original toolhead cable is firmly connected, the covers are secure, the toolhead can move without catching a cable, and no Panda Treat part remains in the printer's movement area.
10. Restore power and confirm normal toolhead operation before starting a filament print.
'''

