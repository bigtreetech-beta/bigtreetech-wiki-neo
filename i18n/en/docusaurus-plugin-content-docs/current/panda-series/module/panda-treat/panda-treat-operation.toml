<ImageView src={require('@site/docs/panda-series/module/panda-treat/img/prepared-surface.webp').default} width="45%"/>
'''

[[block]]
key = "f3d638d7d0b45bee"
origin = '''
扫描 Panda Treat 显示屏上的 QR code，或打开之前保存的 `.local` 地址，进入 Panda Treat 打印界面。手机，平板电脑或电脑必须与 Panda Treat 位于同一 WiFi 网络。
'''
