key = "e20b5dc7e867426c"
origin = '''
<ImageView
  src={require('./img/panda-treat-settings-page.webp').default}
  alt="Panda Treat 设置与更新页面，其中包含待机显示图像设置"
  width="70%"
/>
'''
translate = '''
<ImageView
  src={require('@site/docs/panda-series/module/panda-treat/img/panda-treat-settings-page.webp').default}
  alt="Panda Treat Settings & Updates page including the Idle display image setting"
