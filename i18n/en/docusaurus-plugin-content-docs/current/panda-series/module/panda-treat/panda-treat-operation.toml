[[block]]
key = "764c064301bfdff5"
origin = '''
### 准备打印表面并打开 Panda Treat
'''
translate = '''
### Prepare the print surface and open Panda Treat
'''

[[block]]
key = "b9662bfaeb6862f2"
origin = '''
准备任何打印任务前，请在打印机成型板范围内铺好干净，食品安全的硅胶烘焙垫或烘焙纸。垫子或烘焙纸必须保持平整，并完全位于成型板边界内。
'''
translate = '''
Before preparing any print, cover the area inside the printer build plate with a clean food-safe silicone baking sheet or parchment paper. The sheet must lie flat and remain inside the plate boundary.
'''

[[block]]
key = "eebdd4a31f4aed09"
origin = '''
<ImageView src={require('./img/prepared-surface.webp').default} width="45%"/>
'''
