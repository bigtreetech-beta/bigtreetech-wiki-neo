key = "998f2a1d897d7ceb"
type = "heading"
origin = '''
## 恢复出厂设置
'''
translate = '''
## Factory Reset
'''

[[block]]
key = "42c01b3903c0e557"
type = "admonition"
composite = true
origin = '''
:::warning

{{42c01b3903c0e557-254c430007b82a92}}

:::
'''
translate = '''
:::warning

{{42c01b3903c0e557-254c430007b82a92}}

:::
'''

[[block]]
key = "42c01b3903c0e557-254c430007b82a92"
type = "paragraph"
origin = '''
Panda Knomi V2 恢复出厂设置会清空所有的配置，包括语言，连接的 WiFi，自定义的主机名，自定义的 AP 热点名称和密码，绑定的打印机，打印进度显示选择，主题配色信息。但是无法将自定义的 GIF 恢复为出厂 GIF，GIF 只能通过上传 GIF 或者更新 IMG 修改，出厂的 IMG 文件可从[Panda Knomi V2 的 Github](https://github.com/bigtreetech/PandaKnomi/blob/master/IMG/panda_knomi_factory.img)上面下载。
'''
translate = '''
A factory reset clears all Panda Knomi V2 settings, including language, connected Wi-Fi, custom hostname, custom AP hotspot name and password, bound printer, print-progress display preference, and theme color settings. It does not restore custom GIFs to the factory GIFs. GIFs can only be changed by uploading GIF files or applying an IMG file. Download the factory IMG from the [Panda Knomi V2 GitHub repository](https://github.com/bigtreetech/PandaKnomi/blob/master/IMG/panda_knomi_factory.img).
'''

