origin = '''
Panda Knomi V2 WebUI 中出现的下一个界面是 AP 界面。Panda Knomi V2 AP 是 Panda Knomi V2 广播的 WiFi 热点，允许手机/电脑直接连接到它。如果您不希望广播此热点，则可以将其关闭，但 Panda Knomi V2 会在无法连接到您设置的 WiFi 时自动重新打开此热点。这提供了一种故障保护方式，可以在设置的 WiFi 网络不可用的情况下重新连接到 Panda Knomi V2。
'''
