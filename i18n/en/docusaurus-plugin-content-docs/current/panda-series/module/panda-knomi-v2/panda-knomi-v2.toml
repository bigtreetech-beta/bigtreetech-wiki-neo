type = "paragraph"
origin = '''
在设置界面连接 Panda Knomi V2 的 AP 热点后，直接跳转到的 Web UI 界面，部分手机由于权限的问题可能无法在此界面上传更新 GIF 图片，IMG 文件和固件，请到浏览器中访问 Web UI 再进行此类上传文件的操作。
'''
translate = '''
After connecting to the Panda Knomi V2 AP in your device settings, some phones may automatically open the Web UI in a restricted captive-portal window. This window may not allow GIF, IMG, or firmware uploads. Open the Web UI in a regular browser to upload these files.
'''

