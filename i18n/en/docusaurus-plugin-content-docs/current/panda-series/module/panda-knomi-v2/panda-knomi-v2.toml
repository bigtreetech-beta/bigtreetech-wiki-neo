origin = '''
## 基本参数
'''
translate = '''
## Specifications
'''

[[block]]
key = "e8cafa51df8b8b51-5c87fbd75cc24f3c"
type = "table"
origin = '''
| 参数 | 规格 |
| :-----| :----: |
| 微处理器 | Xtensa 双核 32 位 LX6 ESP32；时钟频率高达 240MHz。|
| 存储器 | PSRAM-8MB(4MB RAM + [4MB Himem](https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/system/himem.html)), Flash-16MB |
| 逻辑电压 | 3.3V |
| 输入电压 | 5V-24V |
| 额定功率 | 0.65W |
| 屏幕外型尺寸 | 34.6mm x 37.9mm x 3.5mm |
| 屏幕尺寸 | 1.28 in |
| 分辨率 | 240 x 240 |
| 显示区域 | 32.4（H）mm x 32.4（V）mm |
| 屏幕驱动芯片 | GC9A01 |
| 可视角度 | 全视域（All View） |
| 背光亮度 | 400 Cd/m² |
| 通信方式 | 2.4G Wi-Fi (IEEE 802.11 b/g/n) |
| 工作温度 | Panda Knomi V2：$-20\,^{\circ}\mathrm{C}$ 至 $+70\,^{\circ}\mathrm{C}$ |
| 储存温度 | $-30\,^{\circ}\mathrm{C}$ 至 $+80\,^{\circ}\mathrm{C}$ |
| 背光寿命 | 大于 20000hr |
'''
translate = '''
| Parameter | Specification |
| :-----| :----: |
| Microcontroller | Xtensa dual-core 32-bit LX6 ESP32; Clock speed up to 240 MHz |
| Memory | PSRAM-8MB (4MB RAM + [4MB Himem](https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/system/himem.html)), Flash-16MB |
| Logic Voltage | 3.3V |
| Input Voltage | 5V-24V |
| Rated Power | 0.65W |
| Display Module Dimensions | 34.6mm x 37.9mm x 3.5mm |
| Screen Size | 1.28 in |
| Resolution | 240 x 240 |
| Active Display Area | 32.4 (H) mm x 32.4 (V) mm |
| Display Driver IC | GC9A01 |
| Viewing Angle | All View |
| Backlight Brightness | 400 Cd/m² |
| Connectivity | 2.4 GHz Wi-Fi (IEEE 802.11 b/g/n) |
| Operating Temperature | Panda Knomi V2: $-20\,^{\circ}\mathrm{C}$ to $+70\,^{\circ}\mathrm{C}$ |
| Storage Temperature | $-30\,^{\circ}\mathrm{C}$ to $+80\,^{\circ}\mathrm{C}$ |
| Backlight Lifetime | Over 20,000 hours |
'''

