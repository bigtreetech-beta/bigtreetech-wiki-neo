The next Web UI page is `AP`. The Panda Knomi V2 AP is a Wi-Fi hotspot broadcast by Panda Knomi V2, allowing phones and computers to connect directly. You can disable it if you do not want the hotspot to be broadcast. However, if Panda Knomi V2 cannot connect to the configured Wi-Fi network, it automatically enables its AP again, providing a fallback connection for troubleshooting.
'''

