type = "paragraph"
origin = '''
Panda Knomi V2 只监听打印机的状态，不控制打印机，所以 Panda Knomi V2 的功能不会受拓竹固件更新的影响。有关受影响和不受影响的更多信息，请参阅[Bambu Lab 官方公告](https://blog.bambulab.com/firmware-update-introducing-new-authorization-control-system-2/)。
'''
translate = '''
Panda Knomi V2 only monitors printer status; it does not control the printer. Therefore, Bambu Lab firmware updates do not affect its functionality. For more information about affected and unaffected features, see the [official Bambu Lab announcement](https://blog.bambulab.com/firmware-update-introducing-new-authorization-control-system-2/).
'''

