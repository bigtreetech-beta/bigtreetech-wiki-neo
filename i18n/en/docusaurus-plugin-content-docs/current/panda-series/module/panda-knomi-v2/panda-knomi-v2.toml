type = "paragraph"
origin = '''
如出现长时间 `无效的IP，自动修正中`，请使用 `Bambu Handy` 或 `Bambu Studio` 尝试控制打印机，如果打印机无应答或显示不在线，可能是打印机所处的网络环境异常，请检查网络环境。如果可以正常控制打印机，请尝试断电重启 Panda Knomi V2，若重启后仍无法正常连接，请联系售后支持邮箱 `support01@bigtree-tech.com`
'''
translate = '''
If `Invalid IP, correcting automatically` remains on the screen for an extended period, try controlling the printer using `Bambu Handy` or `Bambu Studio`. If the printer does not respond or appears offline, check the printer's network connection. If the printer responds normally, power-cycle Panda Knomi V2. If the connection still fails, contact `support01@bigtree-tech.com`.
'''

