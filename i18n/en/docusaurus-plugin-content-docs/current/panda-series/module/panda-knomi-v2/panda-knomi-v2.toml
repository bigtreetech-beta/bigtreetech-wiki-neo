为避免屏幕长时间显示同一个静态画面导致的烧屏，Panda Knomi V2 内置了屏幕保护的逻辑，在显示静态画面时，每隔 15s 显示一次内置的屏保 GIF(此 GIF 不支持自定义)，屏保 GIF 显示时间为 2s。
'''
translate = '''
To reduce the risk of screen burn-in from static images, Panda Knomi V2 displays a built-in screensaver GIF for 2 seconds every 15 seconds while a static screen is shown. This GIF cannot be customized.
'''

