The replacement handle can be moved into a support position, creating a venting path for moisture during drying.
'''

[[block]]
key = "c28f0335e11bdc29"
origin = '''
<ImageView src={require('./img/install25-gap.webp').default} width="50%" />
'''
translate = '''
<ImageView src={require('@site/docs/more-series/bqdry-module/bqdry-mini/img/install25-gap.webp').default} width="50%" />
'''

[[block]]
key = "1fbe4fccb4862b5c"
origin = '''
:::tip

烘干时建议打开排湿通道，帮助湿气排出并减少内部凝露；烘干结束后，可根据存储需要恢复较密闭状态。

