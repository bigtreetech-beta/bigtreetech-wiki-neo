translate = '''
<ImageView src={require('@site/docs/more-series/bqdry-module/bqdry-mini/img/install24-handle.webp').default}  width="30%" />
'''

[[block]]
key = "07fd522c2d23bdcf"
origin = '''
替换把手可以切换到支撑方式，为烘干过程提供排湿通道。
'''
