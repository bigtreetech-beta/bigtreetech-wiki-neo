'''
translate = '''
BQDry Mini supports binding with compatible printers. Once successfully bound and the "Auto-Dry During Print" (or Auto-Start on Print) feature is enabled, the BQDry Mini will automatically start heating when the next print job begins and automatically stop heating when the print job finishes.
'''

[[block]]
key = "75b435630fcacc44"
origin = '''
