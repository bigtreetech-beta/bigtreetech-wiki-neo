'''
translate = '''
### Connecting the External Power Supply
'''

[[block]]
key = "5791f8f075c72080"
origin = '''
连接 **Y 形线** 与 **DC 接口转接线**。
'''
translate = '''
Connect the Y-splitter cable to the DC interface adapter cable.
'''

[[block]]
key = "9b9d04b8bdf4c932"
origin = '''
- Y 形线用于保留 AMS 原有级联使用能力；如没有级联 AMS 的需求，可不连接 Y 形线。
- DC 接口转接线用于连接 24V DC 电源，为 BQDry Mini 独立供电。
'''
translate = '''
- The Y-splitter cable is used to retain the original cascading capabilities of the AMS. If you do not need to cascade multiple AMS units, you may skip the Y-splitter cable.
- The DC interface adapter cable is used to connect the 24V DC power adapter, providing an independent power supply for the BQDry Mini.
'''

[[block]]
key = "d225f316b3554eb3"
origin = '''
<ImageView src={require('./img/install22-y-cable.webp').default}  width="40%" />
'''
translate = '''
<ImageView src={require('@site/docs/more-series/bqdry-module/bqdry-mini/img/install22-y-cable.webp').default}  width="40%" />
'''

[[block]]
key = "bf5c91675522c977"
origin = '''
:::tip

BQDry Mini 的加热供电与 AMS 原有供电相互独立。即使不连接 BQDry Mini 的 24V DC 电源，AMS 仍应通过打印机原有供电正常工作。

:::
'''
translate = '''
:::tip

The heating power supply of the BQDry Mini operates independently from the original AMS power supply. Even if the BQDry Mini's 24V DC power adapter is not connected, the AMS will still function normally through the printer's original power source.

:::
'''

