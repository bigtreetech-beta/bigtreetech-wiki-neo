## Firmware Update
'''

[[block]]
key = "844baebb73dc2044"
origin = '''
BQDry Mini 支持通过 Web UI 进行固件升级。发布新固件后，从以下链接下载固件到电脑，在Web UI中请按照对应固件页面的升级说明操作。
'''
translate = '''
BQDry Mini supports firmware updates directly via the Web UI. When a new firmware version is released, download the firmware file to your computer from the link below, and then follow the update instructions on the corresponding firmware page within the Web UI.
'''

[[block]]
key = "e3198640fb10ce01"
origin = '''
固件下载地址：https://github.com/bigtreetech/BQDry_Mini/tree/master/Firmware
'''
translate = '''
Firmware Download Link: https://github.com/bigtreetech/BQDry_Mini/tree/master/Firmware
'''

[[block]]
key = "c50999996b5703f6"
origin = '''
:::warning

升级固件过程中请保持设备持续供电，不要关闭页面或断开电源或强制重启设备。

:::
'''
translate = '''
:::warning

Firmware Update Safety: Please ensure the device remains continuously powered during the firmware update process. Do not close the browser page, disconnect the power supply, or force restart the device.

:::
'''

[[block]]
key = "998f2a1d897d7ceb"
origin = '''
## 恢复出厂设置
'''
translate = '''
## Factory Reset
'''

[[block]]
key = "58194f4fe502806c"
origin = '''
同时长按控制模块上的两个实体按键 **5 秒以上**，可触发恢复出厂设置。
'''
translate = '''
Press and hold both physical buttons on the control module simultaneously for **more than 5 seconds** to trigger a factory reset.
'''

[[block]]
key = "f11ab3b44d2b1a96"
origin = '''
恢复出厂设置后将清除或恢复以下内容：
'''
translate = '''
A factory reset will clear or restore the following:
'''

[[block]]
key = "7fcbb4303296a390"
origin = '''
- Wi-Fi 网络连接信息；
- 已绑定的打印机；
- 相关设备参数和 Web UI 设置。
'''
translate = '''
- Wi-Fi network connection information
- Bound printers
- Related device parameters and Web UI settings
'''

[[block]]
key = "cfd5944a69dd4c3e"
origin = '''
恢复完成后，请重新按照 [Web UI 首次连接指南](#web-ui-首次连接指南) 配置设备。
'''
translate = '''
Once the reset is complete, please reconfigure the device by following the [Web UI Initial Connection Guide](#web-ui-initial-connection-guide)
'''

[[block]]
key = "e42a0ec591670eb0"
origin = '''
## 特别说明
'''
translate = '''
## Special Notes
'''

[[block]]
key = "37a33bb1945e0439"
origin = '''
### 不限时加热模式
'''
translate = '''
### Continuous Heating Mode (Unlimited)
'''

[[block]]
key = "a8a3d88f2b01eb1e"
origin = '''
当选择"不限时"档位时，产品仍会执行内部温控保护逻辑，但为确保安全，建议设备仅在 **可观察/可监控的环境** 中运行，避免长时间无人看管。
'''
translate = '''
When the Continuous (Unlimited) stage is selected, the device will still execute its internal thermal protection logic. However, for maximum safety, it is highly recommended to operate the equipment only in an observable and monitored environment. Avoid leaving the device running unattended for extended periods.
'''

[[block]]
key = "74e900f8ce29460b"
origin = '''
### 排湿与凝露
'''
translate = '''
### Dehumidification & Condensation
'''

[[block]]
key = "25bc72322ffbd75a"
origin = '''
加热过程中，耗材中的水分会逐渐释放至空气中。建议根据实际烘干状态使用 AMS 替换把手打开适当排湿通道，帮助湿气排出并降低内部水汽凝结的可能。
'''
translate = '''
During the heating process, moisture from the filament will gradually be released into the air. It is advised to open an appropriate dehumidification channel using the AMS replacement handle based on the actual drying status to help expel moisture and reduce the risk of internal condensation.
'''

[[block]]
key = "d18282d659701248"
origin = '''
### 高温表面
'''
translate = '''
### Hot Surfaces
'''

[[block]]
key = "cab149e1731cecf9"
origin = '''
设备加热运行期间，输出模块出风口及附近区域可能处于较高温度。请勿遮挡出风口，也不要在工作期间直接触摸高温区域。
'''
translate = '''
While the heating system is running, the air outlets of the output modules and their surrounding areas may reach elevated temperatures. Do not block the air outlets, and avoid touching these high-temperature areas directly during operation.
'''

[[block]]
key = "aacbc9f64fb078e6"
origin = '''
### 外壳表面纹理
'''
translate = '''
### Shell Surface Texture
'''

[[block]]
key = "4ebcac9d6e6021ca"
origin = '''
BQDry Mini 外壳采用 **尼龙 + 玻璃纤维（PA-GF）** 复合材料。该材料可能呈现类似细小划痕或纤维的表面纹理，这是材料本身的正常特性，并非产品瑕疵。
'''
translate = '''
The shell of the BQDry Mini is made of a Nylon + Glass Fiber (PA-GF) composite material. This material may naturally exhibit surface textures resembling fine scratches or visible fibers. This is a normal and inherent characteristic of the material itself and not a product defect.
'''

[[block]]
key = "cb8b9f87f384e245"
origin = '''
### FCC 合规声明
'''
translate = '''
### FCC Compliance Statement
'''

[[block]]
key = "cbabb58846b181a4"
origin = '''
本设备符合 FCC（美国联邦通信委员会）规则第 15 部分的要求。设备运行须满足以下两个条件：
'''
translate = '''
This device complies with Part 15 of the FCC Rules. Operation is subject to the following two conditions:
'''

[[block]]
key = "92dde3728f0bbd4c"
origin = '''
1. 本设备不得产生有害干扰。
2. 本设备必须能够承受接收到的任何干扰，包括可能导致设备异常运行的干扰。
'''
translate = '''
1. This device may not cause harmful interference.
2. This device must accept any interference received, including interference that may cause undesired operation.
'''

[[block]]
key = "dd979f5d98bb0c6a"
origin = '''
**警告：** 未经合规责任方明确批准而对本设备进行更改或改装，可能导致用户失去操作本设备的授权。
'''
translate = '''
**Warning:** Changes or modifications to this unit not expressly approved by the party responsible for compliance could void the user's authority to operate the equipment.
'''

[[block]]
key = "0822fe247de4d558"
origin = '''
## 重要声明
'''
translate = '''
## Important Declarations
'''

[[block]]
key = "9ad836e5c4601973"
origin = '''
- 请仅使用符合产品规格要求的 24V DC 电源及配件。
- 安装和走线必须避开 AMS 内部运动机构。
- 请勿堵塞输出模块进风 / 出风位置。
- 不限时加热模式下，请确保设备处于可观察/可监控环境。
- 如因错误安装/错误供电/私自改装或未按说明使用导致设备损坏，可能影响产品保修。
'''
translate = '''
- Power Compatibility: Please only use 24V DC power adapters and accessories that comply with the product specifications.
- Mechanism Clearance: Cable routing and module installation must be kept completely clear of the internal moving mechanisms of the AMS.
- Airflow Obstruction: Do not block or obstruct the air inlet or outlet positions of the output modules.
- Monitored Operation: Under the Continuous (Unlimited) heating mode, always ensure the device is operated in an observable and monitored environment.
- Warranty Disclaimer: Damage to the equipment caused by improper installation, incorrect power supply, unauthorized modifications, or failure to follow the instruction manual may void the product warranty.
'''
