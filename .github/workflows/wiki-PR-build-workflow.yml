# this workflow use as pull request check 

name: wiki-PR-build-workflow

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'blog/**'
      - 'src/**'
      - 'static/**'
      - '.github/workflows/**'
      - 'docusaurus.config.ts'
      - 'package.json'
      - 'sidebars.ts'

jobs:
  lint:
    name: Build wiki
    
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Run Meow Linter
      uses: Neko-vecter/meow-lint@v1.0.6
      with:
        github_token: ${{ github.token }}

    - name: Enable Corepack
      run: corepack enable
          
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
        
    # init 
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

      # build 
    - name: build wiki 
      run: pnpm build
